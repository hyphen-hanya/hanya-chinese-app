// Hanya Chinese App - app 模块 (Groovy DSL, 保守配置)
// repositories 由根 settings.gradle 统一管理(FULL_ON_PROJECT_REPOS), 此处不再声明
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.hanyachinese.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.hanyachinese.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        // 仅当 keystore 文件存在时启用签名(CI 从 Secret 解码出 app/hanya-release.keystore)
        release {
            def keystoreFile = file('../hanya-release.keystore')
            if (keystoreFile.exists()) {
                storeFile keystoreFile
                storePassword System.getenv('KEYSTORE_PASSWORD') ?: 'HanyaChinese2026!Secure'
                keyAlias System.getenv('KEY_ALIAS') ?: 'hanyachinese'
                keyPassword System.getenv('KEY_PASSWORD') ?: 'HanyaChinese2026!Secure'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            def keystoreFile = file('../hanya-release.keystore')
            if (keystoreFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
