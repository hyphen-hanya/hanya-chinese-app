name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 从 GitHub Secrets 读取签名配置 (第一次会跳过, 见下)
      KEYSTORE_BASE64: ${{ secrets.HANYACHINESE_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.HANYACHINESE_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.HANYACHINESE_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.HANYACHINESE_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Decode keystore (if secrets configured)
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > hanya-release.keystore
            echo "KEYSTORE_DECODED=1" >> "$GITHUB_ENV"
            ls -la hanya-release.keystore
          else
            echo "No keystore secrets yet → building unsigned debug APK"
          fi

      # 构建 debug APK (始终可装)
      - name: Build debug APK
        id: build_debug
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace > build_stdout.log 2>&1 || true
          echo "DEBUG_EXIT=$?" >> "$GITHUB_ENV"
          echo "===== DEBUG RESULT ====="
          grep -niE "BUILD SUCCESSFUL|BUILD FAILED|what went wrong|FAILURE|error:" build_stdout.log | head -20

      # build.gradle 已根据是否有 keystore 决定是否签名 release
      - name: Build signed release APK
        run: |
          gradle :app:assembleRelease --no-daemon --stacktrace --info > release_stdout.log 2>&1 || true
          echo "RELEASE_EXIT=$?" >> "$GITHUB_ENV"
          echo "===== RELEASE RESULT ====="
          grep -niE "BUILD SUCCESSFUL|BUILD FAILED|what went wrong|caused by:|FAILURE|signed|SigningConfig" release_stdout.log | head -20

      - name: Locate APKs
        run: |
          echo "===== DEBUG APK ====="
          ls -la app/build/outputs/apk/debug/ 2>/dev/null || echo "no debug apk"
          echo "===== RELEASE APK ====="
          ls -la app/build/outputs/apk/release/ 2>/dev/null || echo "no release apk"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: hanya-chinese-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
        if: always()

      - name: Upload gradle log
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: build_stdout.log
        if: always()

  # 一次性生成正式 keystore 的 job (吴总下载一次, 助手存档+配Secret后停用)
  gen-keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Generate release keystore
        run: |
          mkdir -p keystore
          keytool -genkeypair -v \
            -keystore keystore/hanya-release.keystore \
            -alias hanyachinese \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass HanyaChinese2026!Secure \
            -keypass HanyaChinese2026!Secure \
            -dname "CN=HanyaChinese, OU=Mobile, O=HanYa Group, L=Beijing, ST=Beijing, C=CN" 2>&1 | tail -5
          echo "===== keystore 信息 ====="
          keytool -list -v -keystore keystore/hanya-release.keystore -storepass HanyaChinese2026!Secure 2>&1 | head -20
      - name: Upload keystore (first-time only)
        uses: actions/upload-artifact@v4
        with:
          name: hanya-chinese-release-keystore
          path: keystore/hanya-release.keystore
